<!doctype html>
<html lang="zh-Hant" data-theme="tokyo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RadioDeck 網路電台</title>
<meta name="description" content="網路電台播放器：搜尋、國家／類型篩選、我的最愛、EQ 與頻譜視覺化">
<meta name="theme-color" content="#12131d" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RadioDeck">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <header class="head">
    <div class="titles">
      <h1>網路電台</h1>
      <p class="muted">氛圍、Lofi、古典、爵士……搜尋電台、加入最愛，點一下就開始聽。</p>
    </div>
    <div class="head-btns">
      <button id="installBtn" class="btn" hidden>📲 安裝</button>
      <button id="addBtn" class="btn" title="加入你自己知道的電台串流網址（需 https）">➕<span class="lbl"> 新增電台網址</span></button>
      <button id="settingsBtn" class="btn" title="外觀、頻譜、EQ">⚙<span class="lbl"> 設定</span></button>
    </div>
  </header>

  <div id="note" class="note"></div>

  <main class="main">
    <section class="browser">
      <div class="tools">
        <div class="seg" role="group" aria-label="檢視">
          <button id="segAll" class="segbtn left on">電台</button><button id="segFav" class="segbtn right">★ 最愛</button>
        </div>
        <button id="rankBtn" class="btn" title="依 24 小時熱門排序、類型不限；搭配國家就是該國排行榜">🔥 排行榜</button>
        <button id="folderBtn" class="btn" title="在最愛清單裡建立資料夾" hidden>📁<span class="lbl"> 新增資料夾</span></button>
        <input id="search" type="search" placeholder="🔍 輸入電台名稱，按 Enter 搜尋…" enterkeyhint="search" autocomplete="off">
        <select id="country" aria-label="國家"></select>
        <select id="sort" aria-label="排序"></select>
      </div>
      <div id="chips" class="chips" role="group" aria-label="類型"></div>
      <div class="listbox">
        <ul id="list" class="list"></ul>
        <div id="empty" class="empty" hidden></div>
      </div>
    </section>

    <aside class="player" id="player">
      <div class="nowcard">
        <div class="eyebrow"><span>♪ 正在播放</span><span id="timeLabel"></span></div>
        <div id="cardTitle" class="cardtitle">尚未播放</div>
        <div id="cardSub" class="muted ell">選一個電台，按「播放」或直接點一下</div>
        <div id="songBtns" class="songbtns" hidden>
          <button id="copySong" class="btn mini" title="複製目前播放的歌名">📋 複製歌名</button>
          <button id="ggSong" class="btn mini" type="button">🔎 Google</button>
          <button id="ytSong" class="btn mini" type="button">▶ YouTube</button>
        </div>
      </div>
      <div class="vizwrap" id="vizWrap" title="點一下放大">
        <canvas id="viz"></canvas>
        <div id="vizHint" class="vizhint"></div>
      </div>
      <div class="volrow">
        <span>🔊</span>
        <input id="volume" type="range" min="0" max="200" step="1" aria-label="音量">
        <span id="volBadge" class="badge">85%</span>
      </div>
      <div class="btnrow">
        <button id="playBtn" class="btn primary">▶ 播放</button>
        <button id="randBtn" class="btn" title="從目前清單隨機挑一台">🎲<span class="lbl"> 隨機</span></button>
        <button id="favBtn" class="btn" title="加入／移出最愛">★<span class="lbl"> 加入最愛</span></button>
        <button id="stopBtn" class="btn danger" title="停止">■<span class="lbl"> 停止</span></button>
      </div>
    </aside>
  </main>
</div>

<div id="vizFull" class="vizfull" hidden>
  <div class="vf-top">
    <div class="vf-names"><div id="vfTitle" class="vf-title"></div><div id="vfSub" class="muted ell"></div></div>
    <div id="vfTime" class="muted"></div>
    <button id="vfClose" class="btn" aria-label="離開">✕</button>
  </div>
  <canvas id="vizBig"></canvas>
  <div class="hint">點一下畫面、按 Esc 或右上角 ✕ 離開</div>
</div>

<dialog id="addDlg">
  <form method="dialog" id="addForm">
    <h2>新增電台</h2>
    <label>串流網址
      <input id="addUrl" type="url" required placeholder="https://example.com/stream.mp3" autocomplete="off">
    </label>
    <label>電台名稱
      <input id="addName" type="text" placeholder="（可留空，預設用網站名稱）" autocomplete="off">
    </label>
    <p class="hint">支援 mp3 / aac / ogg / m3u8。可以貼 http 網址，網頁版會自動改用 https 嘗試；電台不支援 https 的話只能用桌面版聽。</p>
    <p class="hint">只有電台的網頁、找不到串流網址？用桌面版「新增電台網址」貼上網頁網址，它會自動找出真正的串流；再用「最愛備份」複製清單貼到這裡。</p>
    <div class="dlg-btns">
      <button type="button" class="btn" id="addCancel">取消</button>
      <button type="submit" class="btn primary">加入最愛</button>
    </div>
  </form>
</dialog>

<dialog id="folderDlg">
  <div class="dlg-body">
    <h2>移到資料夾</h2>
    <div id="folderList" class="folder-list"></div>
    <div class="dlg-btns"><button type="button" class="btn" id="folderCancel">取消</button></div>
  </div>
</dialog>

<dialog id="setDlg">
  <div class="dlg-body" id="setBody"></div>
</dialog>

<script src="theme.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
